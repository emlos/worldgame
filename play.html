<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small playable Worldgame interface slice."
    />
    <title>Worldgame</title>
    <link rel="stylesheet" href="./src/ui/browser/styles.css" />
    <script>
      const debug = true;
    </script>
  </head>
  <body>
    <div class="app-layout">
      <aside id="player-panel" class="player-panel" aria-labelledby="player-panel-heading">
        <header class="player-panel-header">
          <h2 id="player-panel-heading">Player</h2>
        </header>
        <dl class="player-summary">
          <dt>Money</dt>
          <dd id="player-money"></dd>
          <dt>Temperature</dt>
          <dd id="player-temperature"></dd>
        </dl>
        <section aria-labelledby="player-stats-heading">
          <h3 id="player-stats-heading">Stats</h3>
          <div id="player-stats" class="player-stats"></div>
        </section>
      </aside>

      <main class="game-shell">
        <header class="topbar">
          <div id="status"></div>
          <div class="topbar-actions">
            <button id="open-map" class="utility-button" type="button">Full map</button>
            <button id="restart" class="utility-button" type="button">Restart</button>
          </div>
        </header>

        <div id="notice" class="notice" aria-live="polite"></div>
        <article id="scene"></article>
      </main>

      <aside id="debug-panel" class="debug-panel" hidden>
        <header class="debug-panel-header">
          <h2>Debug</h2>
          <span>development only</span>
        </header>
        <section class="debug-section">
          <h3>Taylor</h3>
          <button id="debug-teleport-taylor" class="debug-button" type="button">
            Teleport to player
          </button>
          <p class="debug-help">
            Taylor stays for 30 minutes unless an obligation requires them to leave.
          </p>
          <dl class="debug-state">
            <dt>Position</dt>
            <dd id="debug-taylor-position"></dd>
            <dt>Goal</dt>
            <dd id="debug-taylor-goal"></dd>
            <dt>Action</dt>
            <dd id="debug-taylor-action"></dd>
          </dl>
        </section>
      </aside>
    </div>

    <dialog id="full-map-dialog" class="map-dialog">
      <div class="map-dialog-content">
        <header class="map-dialog-header">
          <div>
            <h2>World map</h2>
            <p>Select a location to see its places.</p>
          </div>
          <button id="close-map" class="utility-button" type="button">Close</button>
        </header>
        <div id="full-map" class="map-frame map-frame--world"></div>
        <p id="full-map-details" class="map-details" aria-live="polite"></p>
      </div>
    </dialog>

    <script type="module" src="./src/ui/browser/app.js"></script>
  </body>
</html>
