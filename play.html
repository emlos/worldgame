<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small playable Worldgame interface slice."
    />
    <title>Worldgame</title>
    <link rel="stylesheet" href="./src/ui/browser/styles.css" />
    <script>
      const debug = true;
    </script>
  </head>
  <body>
    <div class="app-layout">
      <aside id="player-panel" class="player-panel" aria-labelledby="player-panel-heading">
        <header class="player-panel-header">
          <h2 id="player-panel-heading">Player</h2>
        </header>
        <dl class="player-summary">
          <dt>Money</dt>
          <dd id="player-money"></dd>
          <dt>Temperature</dt>
          <dd id="player-temperature"></dd>
        </dl>
        <section class="player-stats-section" aria-labelledby="player-stats-heading">
          <h3 id="player-stats-heading">Stats</h3>
          <div id="player-stats" class="player-stats"></div>
        </section>
        <hr class="player-menu-divider" />
        <section class="player-game-menu" aria-labelledby="player-game-menu-heading">
          <h3 id="player-game-menu-heading">Menu</h3>
          <div class="player-menu-actions">
            <button
              id="player-diary-btn"
              class="player-menu-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="player-diary-dialog"
            >
              <svg
                class="player-menu-icon"
                viewBox="0 0 64 64"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M16 6h32v45H16z" />
                <path d="M9 16v-3a7 7 0 0 1 7-7" />
                <path d="M9 16h9M9 24h9M9 32h9M9 40h9" />
                <path d="M9 40v11a7 7 0 0 0 7 7h32" />
                <path d="M16 51h32a7 7 0 0 0-7 7" />
                <path d="M23 13h18v11H23zM23 31h18M23 37h18M23 43h18" />
                <path d="M52 13h8v33l-4 10-4-10zM52 19h8M56 21v23" />
              </svg>
              <span class="player-menu-button-label">Diary</span>
            </button>
            <button
              id="open-map"
              class="player-menu-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="full-map-dialog"
            >
              <svg
                class="player-menu-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m3 6 5-2 8 3 5-2v13l-5 2-8-3-5 2z" />
                <path d="M8 4v13M16 7v13" />
              </svg>
              <span class="player-menu-button-label">Full map</span>
            </button>
          </div>
        </section>
      </aside>

      <main class="game-shell">
        <header class="topbar">
          <div id="status"></div>
          <div class="topbar-actions">
            <button id="restart" class="utility-button" type="button">Restart</button>
          </div>
        </header>

        <div id="notice" class="notice" aria-live="polite"></div>
        <article id="scene"></article>
      </main>

      <aside id="debug-panel" class="debug-panel" hidden>
        <header class="debug-panel-header">
          <h2>Debug</h2>
          <span>development only</span>
        </header>
        <section class="debug-section">
          <h3>Taylor</h3>
          <button id="debug-teleport-taylor" class="debug-button" type="button">
            Teleport to player
          </button>
          <p class="debug-help">
            Taylor stays for 30 minutes unless an obligation requires them to leave.
          </p>
          <dl class="debug-state">
            <dt>Position</dt>
            <dd id="debug-taylor-position"></dd>
            <dt>Goal</dt>
            <dd id="debug-taylor-goal"></dd>
            <dt>Action</dt>
            <dd id="debug-taylor-action"></dd>
          </dl>
        </section>
      </aside>
    </div>

    <dialog id="full-map-dialog" class="map-dialog">
      <div class="map-dialog-content">
        <header class="map-dialog-header">
          <div>
            <h2>World map</h2>
            <p>Select a location to see its places.</p>
          </div>
          <button id="close-map" class="utility-button" type="button">Close</button>
        </header>
        <div id="full-map" class="map-frame map-frame--world"></div>
        <p id="full-map-details" class="map-details" aria-live="polite"></p>
      </div>
    </dialog>

    <dialog
      id="player-diary-dialog"
      class="map-dialog diary-dialog"
      aria-labelledby="player-diary-dialog-heading"
    >
      <div class="map-dialog-content">
        <header class="map-dialog-header">
          <div>
            <h2 id="player-diary-dialog-heading">Diary</h2>
            <p id="player-diary-date"></p>
          </div>
          <button id="close-diary" class="utility-button" type="button">Close</button>
        </header>
        <div id="player-diary-content" class="diary-content" aria-live="polite"></div>
      </div>
    </dialog>

    <script type="module" src="./src/ui/browser/app.js"></script>
  </body>
</html>
